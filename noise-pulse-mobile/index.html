<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#0d0921"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><meta name="apple-mobile-web-app-title" content="Noise Pulse"/><title>Noise Pulse | Creator Dashboard</title><style>
:root{--bg:#0d0921;--panel:#1a1430;--edge:#3e3159;--text:#f9f5ff;--soft:#aaa2c2;--violet:#bea5ff;--mint:#89ecd7;--pink:#fbb0df;--gold:#ffd997}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 110% 420px at 80% -180px,#7e4dbe71,transparent),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:3;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;background:#0c091edb;backdrop-filter:blur(25px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff15}.logo{font-size:18px;font-weight:900;letter-spacing:.2px}.logo em{color:var(--violet);font-style:normal}.logo span{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;width:30px;height:30px;margin-right:8px;background:#c4adff;color:#241836}.tag{font-size:10px;background:#4f386f66;padding:7px 9px;border-radius:12px;color:#dacaff;font-weight:750}.wrap{max-width:680px;margin:auto;padding:24px 19px calc(115px + env(safe-area-inset-bottom))}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:750;color:var(--violet)}h1{font-size:29px;letter-spacing:-1px;margin:8px 0 21px}h2{font-size:18px;margin:23px 0 13px;letter-spacing:-.3px}.card{border:1px solid var(--edge);border-radius:23px;padding:18px;background:linear-gradient(145deg,#231b3a,#171227);margin-bottom:12px;box-shadow:0 8px 24px #0001}.hero{background:linear-gradient(120deg,#59418b,#312653 80%);border-color:#9c84cc7d;padding:24px}.muted{color:var(--soft);font-size:12px;line-height:1.5}.hero .muted{color:#e5dbfa}.big{font-size:45px;font-weight:830;letter-spacing:-2px;margin:8px 0}.bar{height:9px;background:#9b84c155;border-radius:20px;overflow:hidden;margin:21px 0 10px}.bar>div{height:100%;background:linear-gradient(90deg,#81e3cf,#e0ffdf);border-radius:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.metric{min-height:127px;margin-bottom:0;padding:16px}.metric strong{display:block;font-size:24px;letter-spacing:-1px;margin:14px 0 5px;overflow-wrap:anywhere}.mint{color:var(--mint)}.violet{color:var(--violet)}.pink{color:var(--pink)}.gold{color:var(--gold)}.btn{background:linear-gradient(110deg,#dbc2ff,#aaa0ff);border:0;border-radius:14px;color:#22142e;font-weight:800;padding:15px 18px;width:100%;margin:7px 0}.secondary{background:#33294b;color:#f5ebff;border:1px solid #65547a;border-radius:13px;padding:12px 14px;font-weight:700}.post{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;color:inherit;gap:9px;cursor:pointer}.post-name{font-weight:780;font-size:14px;margin-bottom:7px}.post-money{font-weight:800;font-size:17px;color:var(--mint);white-space:nowrap}.pill{font-size:10px;border-radius:8px;padding:4px 7px;display:inline-block;margin-top:7px;color:#e1d1ff;background:#60497b83}.empty{padding:32px 10px;text-align:center}.empty .symbol{font-size:36px;margin-bottom:12px}nav{position:fixed;bottom:0;left:0;right:0;z-index:4;display:flex;justify-content:space-around;background:#130f26ee;border-top:1px solid #63517760;backdrop-filter:blur(25px);padding:10px 3px calc(10px + env(safe-area-inset-bottom))}nav button{border:0;background:none;color:#938da9;font-size:10px;flex:1;max-width:125px;padding:3px 0;display:flex;align-items:center;flex-direction:column;gap:5px}nav button.on{color:#dbc6ff;font-weight:800}nav .sym{font-size:23px}label{font-size:12px;color:var(--soft);font-weight:650;display:block;margin:0 0 7px}input,select{width:100%;padding:13px 14px;margin-bottom:16px;background:#2b2342;color:#fff;border:1px solid #635277;border-radius:12px;outline:none;font-size:16px}input:focus,select:focus{border-color:var(--violet)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}.back{border:0;background:none;color:var(--violet);font-weight:700}.rowbuttons{display:flex;gap:10px}.rowbuttons button{flex:1}.chart{display:flex;align-items:end;justify-content:space-around;gap:7px;height:175px;margin-top:20px}.chartcol{display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px;flex:1;height:100%}.chartbar{background:linear-gradient(#d2b7ff,#7b58bb);border-radius:7px 7px 2px 2px;width:61%;max-width:32px;min-height:5px}.chartlabel{color:var(--soft);font-size:10px}.widget{background:radial-gradient(circle at 100% 0%,#684a90,transparent 60%),#211b3b;aspect-ratio:1;border-radius:28px;padding:16px;border:1px solid #7e659b}.whead{font-size:10px;font-weight:800;color:#e2d4ff}.wval{font-size:clamp(22px,6vw,31px);font-weight:820;letter-spacing:-1px;margin-top:29px}.wfoot{font-size:11px;color:#bcb0d3;margin-top:7px}.island{background:#000;border:1px solid #463752;border-radius:28px;padding:16px;display:flex;justify-content:space-between;max-width:340px;margin:0 auto}.notice{background:#59457466;padding:12px;border-radius:12px;color:#e8dcff;font-size:12px;line-height:1.6;margin-bottom:16px}.help{font-size:12px;color:var(--soft);line-height:1.7}.divider{border-top:1px solid var(--edge);margin:20px 0}</style></head><body><header><div class="logo"><span>◉</span>NOISE <em>PULSE</em></div><div class="tag">● CREATOR MODE</div></header><main class="wrap" id="app"></main><nav id="tabs"></nav><script>
(()=>{'use strict';const KEY='noise-pulse-creator-v1';let data={posts:[],goal:250,rate:.5},tab='Home',editing=null,msg='';try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.posts))data={...data,...saved}}catch(e){}
const el=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),cash=n=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),count=n=>(Number(n)||0).toLocaleString('en-GB'),earn=p=>Number(p.views||0)*Number(p.rate||0)/1000,save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Local storage is unavailable. Try Safari without Private Browsing.')}},head=(tag,title)=>'<div class="eyebrow">'+tag+'</div><h1>'+title+'</h1>',metric=(name,val,detail,color)=>'<div class="card metric"><div class="muted">'+name+'</div><strong class="'+color+'">'+val+'</strong><div class="muted">'+detail+'</div></div>',notice=()=>msg?'<div class="notice">'+safe(msg)+'</div>':'';
function totals(){return {earnings:data.posts.reduce((s,p)=>s+earn(p),0),views:data.posts.reduce((s,p)=>s+Number(p.views||0),0),approved:data.posts.filter(p=>p.status==='approved').reduce((s,p)=>s+earn(p),0),accounts:new Set(data.posts.map(p=>p.handle.toLowerCase())).size}}
function post(p){return '<button class="card post" data-action="edit" data-id="'+safe(p.id)+'"><div style="min-width:0"><div class="post-name">'+safe(p.title)+'</div><div class="muted">'+safe(p.platform)+' · @'+safe(p.handle)+'<br>'+count(p.views)+' views · '+cash(p.rate)+'/1k</div><span class="pill">'+safe(p.status||'pending')+'</span></div><div class="post-money">'+cash(earn(p))+'</div></button>'}
function empty(){return '<div class="card empty"><div class="symbol">✦</div><b>No videos yet</b><p class="help">Add a post to begin tracking your estimated creator earnings.</p><button class="secondary" data-action="new">＋ Add video</button></div>'}
function home(){let t=totals(),pct=Math.min(100,t.earnings/Math.max(1,Number(data.goal)||250)*100);return head('YOUR CREATOR DASHBOARD','Welcome back ✦')+notice()+'<div class="card hero"><div class="muted" style="font-size:11px;font-weight:800;letter-spacing:1.4px">ESTIMATED EARNINGS</div><div class="big">'+cash(t.earnings)+'</div><div class="muted">Calculated from your posts — not an official Noise balance</div><div class="bar"><div style="width:'+pct+'%"></div></div><div class="muted">'+Math.round(pct)+'% towards '+cash(data.goal)+' goal</div></div><div class="grid" style="margin-bottom:16px">'+metric('Total views',count(t.views),'Across tracked accounts','mint')+metric('Approved estimate',cash(t.approved),'Marked approved','violet')+metric('Tracked posts',data.posts.length,t.accounts+' account(s)','pink')+metric('Pending estimate',cash(t.earnings-t.approved),'Awaiting approval','gold')+'</div><button class="btn" data-action="new">＋ Add video</button><h2>Recent videos</h2>'+(data.posts.length?data.posts.slice(0,5).map(post).join(''):empty())}
function posts(){return head('YOUR CONTENT','All videos')+notice()+'<button class="btn" data-action="new">＋ Add new video</button><p class="help">Tap any video to edit its views, rate or approval.</p>'+(data.posts.length?data.posts.map(post).join(''):empty())}
function insights(){let t=totals(),days=[];for(let i=6;i>=0;i--){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);let key=d.toISOString().slice(0,10);days.push({day:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()],total:data.posts.filter(p=>p.date===key).reduce((s,p)=>s+earn(p),0)})}let max=Math.max(1,...days.map(d=>d.total));return head('YOUR NUMBERS','Insights')+notice()+'<div class="card"><b>Estimated earnings by post date</b><p class="help">Last 7 days · USD. This is not official daily payout data.</p><div class="chart">'+days.map(d=>'<div class="chartcol"><div class="muted">'+(d.total?cash(d.total):'—')+'</div><div class="chartbar" style="height:'+Math.max(5,115*d.total/max)+'px"></div><div class="chartlabel">'+d.day+'</div></div>').join('')+'</div></div><div class="grid">'+metric('Total views',count(t.views),'All videos','mint')+metric('Unique accounts',t.accounts,'Tracked handles','pink')+'</div>'}
function widgets(){let t=totals();return head('AT A GLANCE','Widget previews')+notice()+'<p class="help">Previews with your real saved data. Native Home Screen, Lock Screen and Dynamic Island features require a signed iOS app; a webpage or Expo Go cannot install them.</p><div class="grid"><div class="widget"><div class="whead">◉ NOISE PULSE</div><div class="wval">'+cash(t.earnings)+'</div><div class="wfoot">Estimated USD</div><p class="mint" style="font-size:11px">'+count(t.views)+' views</p></div><div class="widget"><div class="whead">◉ TOTAL VIEWS</div><div class="wval">'+count(t.views)+'</div><div class="wfoot">'+data.posts.length+' tracked videos</div><p class="pink" style="font-size:11px">'+t.accounts+' accounts</p></div></div><h2>Dynamic Island concept</h2><div class="card"><div class="island"><b class="violet">◉ Noise Pulse</b><b>'+cash(t.earnings)+'</b></div><p class="help" style="text-align:center">Visual example only, not a Live Activity</p></div>'}
function settings(){return head('YOUR ACCOUNT','Preferences')+notice()+'<div class="card"><form id="prefs"><label>Earnings goal (USD)</label><input type="number" name="goal" min=".01" step=".01" value="'+safe(data.goal)+'" required><label>Default earnings per 1,000 views (USD)</label><input type="number" name="rate" min="0" step=".01" value="'+safe(data.rate)+'" required><button class="btn">Save preferences</button></form></div><h2>Backup and data</h2><div class="card"><p class="help">Your data stays in Safari browser storage on this device. Export a backup before clearing browser data.</p><div class="rowbuttons"><button class="secondary" data-action="export">↓ Export backup</button><button class="secondary" data-action="import">↑ Import</button></div><input id="upload" type="file" accept=".json,application/json" style="display:none"><button class="secondary" style="margin-top:12px" data-action="demo">Add sample posts</button><div class="divider"></div><button class="secondary" data-action="clear">Clear all data</button></div><h2>Install on iPhone</h2><div class="card"><p class="help">In Safari, tap the Share button, then <b>Add to Home Screen</b>. This gives you an app-style Home Screen shortcut, not a native Apple widget.</p></div><h2>Data accuracy</h2><div class="card"><p class="help">Noise Pulse is an independent, manual tracker. It has no creator API connection and does not show official earnings or payouts. Estimated earnings = views × entered USD rate ÷ 1,000.</p></div>'}
function editor(){let p=editing==='new'?{title:'',handle:'',views:'',rate:data.rate,platform:'TikTok',status:'pending'}:data.posts.find(x=>String(x.id)===String(editing));if(!p)return posts();let options=(items,value)=>items.map(x=>'<option value="'+x+'" '+(x===value?'selected':'')+'>'+x+'</option>').join('');return '<div class="toprow"><div>'+head('YOUR CONTENT',editing==='new'?'New video':'Edit video')+'</div><button class="back" data-action="cancel">✕ Close</button></div><form class="card" id="editpost"><label>Video title</label><input name="title" maxlength="100" placeholder="My new video" value="'+safe(p.title)+'" required><label>Creator account handle</label><input name="handle" maxlength="60" placeholder="@username" value="'+safe(p.handle)+'" required><div class="formgrid"><div><label>Total views</label><input name="views" id="views" type="number" min="0" step="1" inputmode="numeric" value="'+safe(p.views)+'" required></div><div><label>USD per 1,000 views</label><input name="rate" id="rate" type="number" min="0" step=".01" inputmode="decimal" value="'+safe(p.rate)+'" required></div></div><div class="formgrid"><div><label>Platform</label><select name="platform">'+options(['TikTok','Instagram','Snapchat','Facebook','YouTube','Other'],p.platform)+'</select></div><div><label>Approval</label><select name="status">'+options(['pending','approved'],p.status)+'</select></div></div><div class="card" style="background:#33284b"><div class="muted">Estimated video earnings</div><div class="mint" id="estimate" style="font-size:30px;font-weight:800;margin-top:8px">'+cash(earn(p))+'</div></div><button class="btn">Save video</button></form><div class="rowbuttons"><button class="secondary" data-action="cancel">Cancel</button>'+(editing==='new'?'':'<button class="secondary" data-action="delete">Delete video</button>')+'</div>'}
function draw(){el('app').innerHTML=editing!==null?editor():({Home:home,Posts:posts,Insights:insights,Widgets:widgets,Settings:settings}[tab])();el('tabs').innerHTML=[['Home','◉'],['Posts','▤'],['Insights','▥'],['Widgets','◫'],['Settings','⚙']].map(([name,icon])=>'<button data-action="tab" data-page="'+name+'" class="'+(tab===name&&editing===null?'on':'')+'"><span class="sym">'+icon+'</span>'+name+'</button>').join('')}
function navigate(t){tab=t;editing=null;msg='';draw();scrollTo(0,0)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a==='tab')return navigate(b.dataset.page);if(a==='new'||a==='edit'){editing=a==='new'?'new':b.dataset.id;msg='';draw();scrollTo(0,0);return}if(a==='cancel'){editing=null;draw();return}if(a==='delete'){if(confirm('Delete this video?')){data.posts=data.posts.filter(p=>String(p.id)!==String(editing));save();navigate('Posts')}return}if(a==='clear'){if(confirm('Delete all saved creator data?')){data={posts:[],goal:250,rate:.5};save();navigate('Home')}return}if(a==='demo'){if(data.posts.length&&!confirm('Add example posts alongside existing videos?'))return;let n=Date.now(),date=new Date().toISOString().slice(0,10);data.posts=[{id:String(n),title:'Demo · Story clip',handle:'demo_creator',views:14000,rate:.5,platform:'TikTok',status:'approved',date},{id:String(n+1),title:'Demo · New campaign',handle:'demo_creator_2',views:18200,rate:1.25,platform:'Instagram',status:'pending',date},...data.posts];save();navigate('Home');msg='Sample posts added. These are not real earnings.';draw();return}if(a==='export'){let content=JSON.stringify({app:'Noise Pulse',data},null,2),url=URL.createObjectURL(new Blob([content],{type:'application/json'})),x=document.createElement('a');x.href=url;x.download='noise-pulse-backup.json';document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);return}if(a==='import')el('upload').click()});
document.addEventListener('input',e=>{if(['views','rate'].includes(e.target.id)&&el('estimate'))el('estimate').textContent=cash(Math.max(0,Number(el('views').value)*Number(el('rate').value)/1000))});
document.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);if(e.target.id==='prefs'){data.goal=Math.max(.01,Number(f.get('goal'))||250);data.rate=Math.max(0,Number(f.get('rate'))||0);save();msg='Settings saved.';draw();return}if(e.target.id==='editpost'){let title=String(f.get('title')||'').trim(),handle=String(f.get('handle')||'').trim().replace(/^@/,''),views=Number(f.get('views')),rate=Number(f.get('rate'));if(!title||!handle||!Number.isFinite(views)||views<0||!Number.isFinite(rate)||rate<0)return alert('Enter a valid title, handle, views and rate.');let previous=data.posts.find(p=>String(p.id)===String(editing)),p={id:editing==='new'?String(Date.now()):editing,title,handle,views:Math.floor(views),rate,platform:f.get('platform'),status:f.get('status'),date:previous?previous.date:new Date().toISOString().slice(0,10)};if(editing==='new')data.posts.unshift(p);else data.posts=data.posts.map(x=>String(x.id)===String(editing)?p:x);save();navigate('Home')}});
document.addEventListener('change',e=>{if(e.target.id!=='upload')return;let file=e.target.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result),v=obj.data||obj;if(!Array.isArray(v.posts))throw Error('Invalid file');if(!confirm('Replace existing saved data with this backup?'))return;data={posts:v.posts,goal:Number(v.goal)||250,rate:Number(v.rate)||0};save();navigate('Home');msg='Backup imported.';draw()}catch(err){alert('Import failed: '+err.message)}};reader.readAsText(file)});draw()})();
</script></body></html>
